# Render blueprint. MULTI_SESSION=1 gives every browser its own private in-memory draft (nothing is written to disk).
# Free instances sleep when idle and lose all drafts on restart.
services:
  - type: web
    name: fantasy-draft-engine
    runtime: docker
    plan: free
    healthCheckPath: /health/data
    envVars:
      - key: SPORT
        value: nba
      - key: LEAGUE_PRESET
        value: espn_default
      - key: DRAFT_PLATFORM
        value: manual
      - key: MULTI_SESSION
        value: "1"
      - key: MAX_SESSIONS
        value: "100"
      - key: SESSION_HOURS
        value: "3"
      - key: REQUEST_LOG                # one JSON log line per request, with a request id (visible in Render's Logs tab)
        value: "1"
      - key: LOG_FORMAT
        value: json
      - key: METRICS_TOKEN              # protects /metrics and /metrics/summary; Render generates it, read it in the dashboard
        generateValue: true
      - key: DEMO_NOTICE                # the banner at the top of the page
        value: "Demo with sample data: the players and stats are invented. Your draft is private to this browser and forgotten after a few hours idle. Source: github.com/mtquach1/fantasy-draft-engine"
